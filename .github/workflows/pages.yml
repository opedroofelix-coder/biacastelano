name: Publicar no GitHub Pages

# Publica o site a cada push na main. O site é estático: não tem build,
# o conteúdo da raiz do repositório é servido como está.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa uma publicação terminar antes de começar a próxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ATENÇÃO: o Pages precisa ser ligado uma vez à mão, em
      # Settings -> Pages -> Source: "GitHub Actions". O enablement abaixo
      # tenta criar o site sozinho, mas o GITHUB_TOKEN não tem essa permissão
      # ("Resource not accessible by integration"); depois de ligado, este
      # passo só confirma a configuração e segue.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v4
